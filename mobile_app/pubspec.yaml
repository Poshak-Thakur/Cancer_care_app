name: saathi_app
description: "Dost - The cancer care companion (Offline-First Mobile App)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Media
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  video_player: ^2.14.1
  audioplayers: ^6.8.1
  record: ^7.1.1
  speech_to_text: ^7.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Networking & Real-Time Communication
  http: ^1.6.0
  http_parser: ^4.1.2
  socket_io_client: ^3.1.6
  agora_rtc_engine: ^6.6.4
  permission_handler: ^12.0.3

  # Firebase & CallKit
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_callkit_incoming: ^3.1.6

  # Storage & Offline-First Persistence
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.6
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_master_1024.png"
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: "assets/icons/icon_foreground_1024.png"
  remove_alpha_ios: true